user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upstream definitions must be inside http context
    upstream usersapi {
        server users-api:80;
    }

    upstream chatgpttool {
        server chatgpttool:80;
    }

    server {
        listen       80;
        server_name  localhost;

        # Route /api/ to Users.API service
        location /api/ {
            proxy_pass http://usersapi/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /auth/ to Users.API service
        location /auth/ {
            proxy_pass http://usersapi/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route root and other paths to ChatGPTTool
        location / {
            proxy_pass http://chatgpttool/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files (nếu có)
        location /static/ {
            alias /var/www/static/;
        }
    }
}
