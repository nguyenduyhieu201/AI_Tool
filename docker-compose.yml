version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SwN12345678
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  users.api:
    build:
      context: .
      dockerfile: Users.API/Dockerfile
    container_name: users-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AIToolDb;User=sa;Password=SwN12345678;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379,abortConnect=false,connectRetry=3,connectTimeout=5000
    ports:
      - "5011:80"
    depends_on:
      - sqlserver
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: chatgpt-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: chatgpt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped

  chatgpt-api:
    build:
      context: .
      dockerfile: ChatGPT.API/Dockerfile
    container_name: chatgpt-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Mongo=mongodb://mongo:27017
      - MongoDatabase=chatgpt_service
    ports:
      - "5013:80"
    depends_on:
      - mongo
      - rabbitmq
    restart: unless-stopped


  chatgpttool:
    build:
      context: .
      dockerfile: ChatGPTTool/Dockerfile
    container_name: chatgpttool
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "5012:80"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "5010:80"
    volumes:
      - ./API.Gateways/nginx.conf:/etc/nginx/nginx.conf:ro
      # Nếu bạn có SSL, mount thêm thư mục ssl:
      # - ./API.Gateways/ssl:/etc/nginx/ssl:ro
    depends_on:
      - users.api
      - chatgpt-api
      - chatgpttool
    restart: unless-stopped

volumes:
  sqlserver_data:
  redis_data:
  mongo_data: