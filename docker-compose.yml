services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SwN12345678
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - ai-tool-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ai-tool-network

  users.api:
    build:
      context: .
      dockerfile: Users.API/Dockerfile
    container_name: users-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AIToolDb;User=sa;Password=SwN12345678;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379,abortConnect=false,connectRetry=3,connectTimeout=5000
    ports:
      - "5011:80"
    depends_on:
      - sqlserver
      - redis
    restart: unless-stopped
    networks:
      - ai-tool-network

  mongo:
    image: mongo:6.0
    container_name: chatgpt-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - ai-tool-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: chatgpt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped
    networks:
      - ai-tool-network

  chatgpt-api:
    build:
      context: ./ChatGPT.API
      dockerfile: Dockerfile
    container_name: chatgpt-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__Mongo=mongodb://mongo:27017
      - ConnectionStrings__Redis=redis:6379,abortConnect=false,connectRetry=3,connectTimeout=5000
      - MongoDatabase=chatgpt_service
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
    ports:
      - "5014:80"
    depends_on:
      - mongo
      - rabbitmq
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-tool-network


  chatgpttool:
    build:
      context: .
      dockerfile: ChatGPTTool/Dockerfile
    container_name: chatgpttool
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "5012:80"
    restart: unless-stopped
    networks:
      - ai-tool-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "5010:80"
    volumes:
      - ./API.Gateways/nginx.conf:/etc/nginx/nginx.conf:ro
      # Nếu bạn có SSL, mount thêm thư mục ssl:
      # - ./API.Gateways/ssl:/etc/nginx/ssl:ro
    depends_on:
      - users.api
      - chatgpt-api
      - chatgpttool
    restart: unless-stopped
    networks:
      - ai-tool-network

volumes:
  sqlserver_data:
  redis_data:
  mongo_data:

networks:
  ai-tool-network:
    driver: bridge